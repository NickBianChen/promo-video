<template>
  <style>

  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const tip = { x: 7, y: 4 };
    const T = { x: 540, y: 1150 };                      // upload area centre
    const TAB = { photo: { x: 539, y: 863 }, describe: { x: 807, y: 863 } };
    const BTN = { x: 536, y: 973 };
    const cur = (p) => ({ x: p.x - tip.x, y: p.y - tip.y });
    const ripple = (at, p) => tl.fromTo("#p2-ripple", { x: p.x, y: p.y, scale: 0.4, opacity: 0.9 }, { scale: 2.8, opacity: 0, duration: 0.5, ease: "power2.out", immediateRender: false }, at);
    gsap.set("#p2-ripple", { opacity: 0 });
    tl.fromTo("#p2-stage", { opacity: 0, scale: 1.03 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, 0);
    tl.fromTo("#p2-card", { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.1);
    // A: carry the selfie onto the upload area
    tl.set("#p2-thumb", { x: 880 - 75, y: 1400 - 91 }, 0);
    tl.set("#p2-cursor", { x: 880 - tip.x + 20, y: 1400 - tip.y + 30 }, 0);
    tl.to(["#p2-thumb", "#p2-cursor"], { opacity: 1, duration: 0.2 }, 0.4);
    tl.to("#p2-thumb", { x: T.x - 75, y: T.y - 91, duration: 0.8, ease: "power2.inOut" }, 0.5);
    tl.to("#p2-cursor", { x: T.x - tip.x + 20, y: T.y - tip.y + 30, duration: 0.8, ease: "power2.inOut" }, 0.5);
    ripple(1.35, T);
    tl.to("#p2-filled", { opacity: 1, duration: 0.3 }, 1.4);
    tl.to("#p2-thumb", { opacity: 0, duration: 0.3 }, 1.4);
    // B: the three ways to choose
    tl.to("#p2-card", { opacity: 0, duration: 0.3 }, 2.0);
    tl.to("#p2-styles", { opacity: 1, duration: 0.3 }, 2.0);
    tl.to("#p2-cursor", { x: cur(TAB.photo).x, y: cur(TAB.photo).y, duration: 0.6, ease: "power2.inOut" }, 2.2);
    ripple(2.85, TAB.photo);
    tl.to("#p2-photo", { opacity: 1, duration: 0.25 }, 2.9);
    tl.to("#p2-styles", { opacity: 0, duration: 0.25 }, 2.9);
    tl.to("#p2-cursor", { x: cur(TAB.describe).x, y: cur(TAB.describe).y, duration: 0.5, ease: "power2.inOut" }, 3.3);
    ripple(3.85, TAB.describe);
    tl.to("#p2-describe", { opacity: 1, duration: 0.25 }, 3.9);
    tl.to("#p2-photo", { opacity: 0, duration: 0.25 }, 3.9);
    // C: press the button
    tl.to("#p2-describe", { opacity: 0, duration: 0.3 }, 4.5);
    tl.fromTo("#p2-btn", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }, 4.5);
    tl.to("#p2-cursor", { x: cur(BTN).x, y: cur(BTN).y, duration: 0.6, ease: "power2.inOut" }, 4.6);
    ripple(5.3, BTN);
    tl.to("#p2-btn", { scale: 0.985, duration: 0.1, ease: "power2.in" }, 5.3);
    tl.to("#p2-btn", { scale: 1, duration: 0.2, ease: "power2.out" }, 5.4);
    tl.to("#p2-stage", { opacity: 0, duration: 0.2, ease: "power2.in" }, 6.0);
    window.__timelines["portrait-p2"] = tl;
  </script>
