<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/css/theme.css" />
    <link rel="stylesheet" href="assets/css/brand.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <script src="assets/js/motion.js"></script>
    <style>
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--canvas);
        font-family: var(--font-display);
        color: var(--ink);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!--
      Landscape root (demo, 10s). Replace the demo hosts with the storyboard's
      scenes. Hosts of neighbouring scenes overlap 0.2s; scene cuts sit on
      music beats (npx hyperframes beats . --json).
    -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <div id="bg-landscape" data-composition-id="bg-landscape" data-composition-src="compositions/bg-landscape.html"
        data-start="0" data-duration="10" data-track-index="0" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="scene-1" data-composition-id="scene-demo" data-composition-src="compositions/scene-demo.html"
        data-start="0" data-duration="3.2" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"
        style="z-index:10;"></div>
      <div id="cmp-1" data-composition-id="compare" data-composition-src="compositions/compare.html"
        data-start="3.0" data-duration="3.4" data-track-index="11" data-track-kind="graphics" data-width="640" data-height="800"
        style="left:1060px;top:120px;width:640px;height:800px;z-index:20;border-radius:var(--card-radius);overflow:hidden;box-shadow:var(--card-shadow);"
        data-variable-values='{"before_src":"assets/placeholder/before.svg","after_src":"assets/placeholder/after.svg","label_a":"Before","label_b":"After","wipe_at":0.4,"exit":"fade","duration":3.4}'></div>
      <div id="cap-1" data-composition-id="caption-rise" data-composition-src="compositions/caption-rise.html"
        data-start="0.15" data-duration="3.05" data-track-index="20" data-track-kind="captions" data-width="900" data-height="560"
        style="left:100px;top:260px;width:900px;height:560px;z-index:30;"
        data-variable-values='{"text":"Your hook goes here.","accent":"ink","size":11,"exit":"fade","duration":3.05}'></div>
      <div id="cap-2" data-composition-id="caption-rise" data-composition-src="compositions/caption-rise.html"
        data-start="3.2" data-duration="3.2" data-track-index="20" data-track-kind="captions" data-width="900" data-height="560"
        style="left:100px;top:260px;width:900px;height:560px;z-index:30;"
        data-variable-values='{"text":"Show the real result.","accent":"green","size":11,"exit":"fade","duration":3.2}'></div>
      <div id="cta" data-composition-id="cta" data-composition-src="compositions/cta.html"
        data-start="6.2" data-duration="3.8" data-track-index="30" data-track-kind="graphics" data-width="1920" data-height="1080"
        style="left:0;top:0;width:1920px;height:1080px;z-index:30;"
        data-variable-values='{"brand_name":"Brand","headline":"Try it free.","chip":"Free credits · No card needed","cta":"Get started","url":"example.com","fine":"Results may vary.","duration":3.8}'></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
